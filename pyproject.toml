[project]
name = "flexible_emission_hmm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Benjamin Yu Sheng Chang", email = "benji.chang@mail.utoronto.ca" },
    { name = "Leo Yang", email = "ysleo.yang@mail.utoronto.ca" }
]
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=7.3.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "polars>=1.44.2",
    "scipy>=1.15.3",
    "scikit-learn>=1.7.2",
    "hmmlearn==0.3.3",
    "threadpoolctl>=3.1.0",
]

[project.scripts]
flexibleemissionhmm = "flexibleemissionhmm:main"

[project.optional-dependencies]
flows = [
    "pyro-ppl>=1.9.1,<2",
]
# Optional torch builds for Linux (pick at most one, combine with --extra flows).
# Without either extra, uv resolves the default PyPI torch (unchanged behavior).
#   AMD GPU (ROCm 7.1):  uv sync --extra flows --extra rocm
#   CPU only (small):    uv sync --extra flows --extra cpu
cpu = ["torch>=2.13"]
rocm = ["torch>=2.13", "triton-rocm; sys_platform == 'linux'"]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = [
    "flexible_emission_hmm",
    "hmmlearn_flow_hmm",
    "synthetic_data_generation",
    "model_evaluation",
]

[dependency-groups]
dev = [
    "hmmlearn==0.3.3",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "rocm" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.1"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
]
triton-rocm = { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" }
